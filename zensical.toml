[project]
site_name = "Mancuso Lab"
copyright = '© 2019–<span id="copyright-year">2026</span> Mancuso Lab.'
site_description = "Statistical genetics of complex disease at USC"
repo_url = "https://github.com/mancusolab"
repo_name = "GitHub"
dev_addr = "127.0.0.1:4242"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["assets/footer.js"]
nav = [
  { Home = "index.md" },
  { Research = "research.md" },
  { People = "people.md" },
  { Publications = "publications.md" },
  { Software = "software.md" },
  { Teaching = "teaching.md" },
  { Blog = "blog/index.md" },
  { "Join the Lab" = "join.md" },
]

[project.plugins.blog]

[project.plugins.tags]

[project.plugins.redirects.redirect_maps]
"tutorials/index.md" = "blog/index.md"

[project.theme]
variant = "modern"
custom_dir = "overrides"
icon.logo = "lucide/dna"
icon.repo = "octicons/mark-github-16"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }
